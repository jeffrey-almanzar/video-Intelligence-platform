# Local development stack. AI inference (Ollama, MLX) runs natively on the host,
# because Docker on macOS has no Metal GPU access (docs/TECHNICAL_DECISIONS.md, ADR-004).
name: vip

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports: ['${POSTGRES_PORT:-5432}:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    # BullMQ requires noeviction; AOF so queued jobs survive a restart.
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    ports: ['${REDIS_PORT:-6379}:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    # S3-compatible object store. MinIO no longer publishes Docker images (ADR-020).
    image: chrislusf/seaweedfs:latest
    entrypoint: ['/bin/sh', '/entrypoint.sh']
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
    ports: ['${S3_PORT:-8333}:8333']
    volumes:
      - storage-data:/data
      - ./seaweedfs/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      # Any HTTP response (403 for anonymous) proves the S3 gateway is up.
      test: ['CMD-SHELL', 'wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q HTTP/']
      interval: 5s
      timeout: 3s
      retries: 30

  storage-init:
    image: chrislusf/seaweedfs:latest
    depends_on:
      storage: { condition: service_healthy }
    entrypoint: ['/bin/sh', '-c']
    # Idempotent: creating a bucket that already exists is harmless.
    command:
      - "echo 's3.bucket.create -name ${S3_BUCKET:?}' | weed shell -master=storage:9333"
    restart: 'no'

  migrate:
    image: vip-api:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/db/migrate.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    profiles: ['api']

  api:
    image: vip-api:local
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      S3_FORCE_PATH_STYLE: 'true'
      # The AI service runs natively on the host (Metal); reach it from the container.
      AI_API_URL: http://host.docker.internal:${AI_API_PORT:-8000}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT_DOCKER:-}
      OTEL_SERVICE_NAME: vip-api
    ports: ['${API_PORT:-3000}:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    profiles: ['api']

  observability:
    # Grafana + Tempo + Loki + Prometheus + OTel collector in one container. Opt-in (RAM).
    image: grafana/otel-lgtm:latest
    ports:
      - '3001:3000' # Grafana UI
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    profiles: ['observability']

volumes:
  postgres-data:
  redis-data:
  storage-data:
