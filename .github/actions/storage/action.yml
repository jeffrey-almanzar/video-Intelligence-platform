name: S3-compatible storage
description: Starts SeaweedFS (same entrypoint as local compose), creates the bucket and applies CORS/lifecycle.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        docker run -d --name storage -p 8333:8333 \
          -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY \
          -v "$GITHUB_WORKSPACE/infra/compose/seaweedfs/entrypoint.sh:/entrypoint.sh:ro" \
          --entrypoint /bin/sh chrislusf/seaweedfs:latest /entrypoint.sh
        for i in $(seq 1 60); do curl -s -o /dev/null localhost:8333 && break; sleep 1; done
        sleep 3
        docker exec storage sh -c "echo 's3.bucket.create -name $S3_BUCKET' | weed shell -master=localhost:9333"
        node --env-file-if-exists=.env apps/api/scripts/storage-setup.ts
