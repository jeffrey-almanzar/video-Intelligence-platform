[project]
name = "vip-ai"
version = "0.1.0"
description = "Video Intelligence Platform: media processing, transcription and AI pipeline workers + internal API"
readme = "README.md"
# Pinned to 3.12: ML wheels (MLX, ctranslate2, torch) lag new Python releases (ADR-019).
requires-python = ">=3.12,<3.13"
dependencies = [
    "bullmq>=3.6.3",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "redis>=8.1.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-api = "vip_ai.api.main:run"
ai-worker = "vip_ai.worker.main:run"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
# Apple Silicon only. Linux (CI / cloud) uses faster-whisper instead (ADR-004).
ml = [
    "mlx-whisper>=0.4.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[tool.uv]
default-groups = ["dev", "ml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["S", "T20", "E501"] # one-off spike scripts
"tests/**" = ["S101", "S105", "S106"] # asserts and fake test credentials

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vip_ai"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["bullmq.*", "mlx_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires Postgres, Redis and Ollama running locally"]
addopts = "-m 'not integration'"
